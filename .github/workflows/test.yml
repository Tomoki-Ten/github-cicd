name: Test
on:
  pull_request:
    paths: ['go/**/*.go']  # ファイルのフィルタリング設定
    # paths
    # paths-ignore
    # branches
    # branches-ignore
    # tags
    # tags-ignore
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 公式アクション
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test go/excellent/*.go